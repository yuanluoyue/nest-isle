name: nest-isle

services:
  postgres:
    image: postgres:16-alpine
    container_name: nest-isle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nest_isle
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nest_isle"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s



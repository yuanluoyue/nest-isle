name: ${COMPOSE_PROJECT_NAME:-nest-isle}

services:
  prometheus:
    image: prom/prometheus
    container_name: ${COMPOSE_PROJECT_NAME:-nest-isle}-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../data/prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-remote-write-receiver'
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  loki:
    image: grafana/loki
    container_name: ${COMPOSE_PROJECT_NAME:-nest-isle}-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./config/loki.yml:/etc/loki/local-config.yaml:ro
      - ../data/loki:/loki
    command: -config.file=/etc/loki/local-config.yaml

  tempo:
    image: grafana/tempo
    container_name: ${COMPOSE_PROJECT_NAME:-nest-isle}-tempo
    restart: unless-stopped
    ports:
      - "3200:3200"   # tempo query frontend
      - "4318:4318"   # OTLP HTTP receiver
      - "4317:4317"   # OTLP gRPC receiver
    volumes:
      - ./config/tempo.yml:/etc/tempo/tempo.yaml:ro
      - ../data/tempo:/var/tempo
    command: -config.file=/etc/tempo/tempo.yaml

  promtail:
    image: grafana/promtail:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nest-isle}-promtail
    restart: unless-stopped
    depends_on:
      - loki
    volumes:
      - ./config/promtail.yml:/etc/promtail/config.yml:ro
      - ../apps/server/logs:/var/log/server:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml

  grafana:
    image: grafana/grafana
    container_name: ${COMPOSE_PROJECT_NAME:-nest-isle}-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
      - tempo
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../data/grafana:/var/lib/grafana
